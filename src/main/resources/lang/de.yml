  - "<yellow>/<cmd> setup<gray> | <yellow>info"
help-global:
  - "<yellow>/timer toggle<gray> – globalen Timer aus-/einblenden (Opt-out)"
  - "<yellow>/timer goal list|add|remove [ziel]<gray> – Ziele"
  - "<yellow>/timer rule [regel] [wert]<gray> – Regeln"
  - "<yellow>/timer language [de|en]<gray> | <yellow>reload"
  - "<gray>Eigener Timer: <yellow>/ptimer help"

