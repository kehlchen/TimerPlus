help:
  - "<gold><bold>Timer – Commands"
  - "<yellow>/<cmd> resume<gray> | <yellow>pause<gray> | <yellow>reset<gray> | <yellow>stop"
  - "<yellow>/<cmd> set [time]<gray> – set time (countdown: start time)"
  - "<yellow>/<cmd> add [time]<gray> – add/subtract time (e.g. -30s)"
  - "<yellow>/<cmd> mode up|down<gray> – stopwatch or countdown"
  - "<yellow>/<cmd> lap [name]<gray> | <yellow>laps<gray> – split times"
  - "<yellow>/<cmd> design [name]<gray> – choose a design"
  - "<yellow>/<cmd> setup<gray> | <yellow>info"
help-global:
  - "<yellow>/timer toggle<gray> – show/hide the global timer (opt-out)"
  - "<yellow>/timer goal list|add|remove [goal]<gray> – goals"
  - "<yellow>/timer rule [rule] [value]<gray> – rules"
  - "<yellow>/timer language [de|en]<gray> | <yellow>reload"
  - "<gray>Your own timer: <yellow>/ptimer help"

